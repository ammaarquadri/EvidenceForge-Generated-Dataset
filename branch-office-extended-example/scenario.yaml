version: "1.0"
name: branch-office-extended-example
description: |
  Extended branch-office scenario built on top of the original
  "branch-office-example" lab. Same small mixed Windows/Linux environment
  (Active Directory, file server, DMZ web portal, explicit forward proxy),
  but the attack storyline is stretched to 20 distinct storyline entries so
  more log families and MITRE ATT&CK techniques show up in a single run:
  external recon, DMZ web-shell foothold, internal discovery, credential
  theft, admin-account lateral movement to the file server and domain
  controller, AD enumeration, staging/archiving, scheduled-task persistence,
  log clearing, and two separate outbound beaconing/exfiltration bursts.

environment:
  description: "Small insurance branch office with Active Directory, a file server, a DMZ web portal, and an explicit forward proxy"
  domain: "northstar-branch.local"

  timezone:
    default: "America/New_York"

  proxy:
    mode: explicit
    listener_port: 8080

  users:
    - username: maya.patel
      full_name: "Maya Patel"
      email: "maya.patel@northstarclaims.com"
      persona: accountant
      primary_system: WS-MPATEL-01
      groups: ["finance"]
      enabled: true
      browsing_intensity: normal

    - username: owen.reed
      full_name: "Owen Reed"
      email: "owen.reed@northstarclaims.com"
      persona: sales
      primary_system: WS-OREED-01
      groups: ["sales"]
      enabled: true
      browsing_intensity: heavy

    - username: lena.morris
      full_name: "Lena Morris"
      email: "lena.morris@northstarclaims.com"
      persona: analyst
      primary_system: WS-LMORRIS-01
      groups: ["claims"]
      enabled: true
      browsing_intensity: normal

    - username: nina.kapoor
      full_name: "Nina Kapoor"
      email: "nina.kapoor@northstarclaims.com"
      persona: sysadmin
      primary_system: WS-NKAPOOR-01
      groups: ["it-admins", "domain-admins"]
      enabled: true
      browsing_intensity: light

    - username: victor.hale
      full_name: "Victor Hale"
      email: "victor.hale@northstarclaims.com"
      persona: executive
      primary_system: WS-VHALE-01
      groups: ["branch-leadership"]
      enabled: true
      browsing_intensity: normal

  service_accounts:
    - www-data
    - svc-backup
    - svc-proxy

  stale_accounts:
    - username: carla.nunez
      last_active: "2023-11-17"
      reason: "Former claims adjuster; cached credentials still referenced by an old laptop task"
    - username: svc-print-old
      last_active: "2023-08-02"
      reason: "Retired print deployment account left in one legacy startup script"

  systems:
    - hostname: WS-MPATEL-01
      ip: "10.44.10.21"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: maya.patel
      services: ["dns-client"]

    - hostname: WS-OREED-01
      ip: "10.44.10.22"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: owen.reed
      services: ["dns-client"]

    - hostname: WS-LMORRIS-01
      ip: "10.44.10.23"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: lena.morris
      services: ["dns-client"]

    - hostname: WS-NKAPOOR-01
      ip: "10.44.10.24"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: nina.kapoor
      services: ["dns-client"]

    - hostname: WS-VHALE-01
      ip: "10.44.10.25"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: victor.hale
      services: ["dns-client"]

    - hostname: DC-BO-01
      ip: "10.44.20.10"
      os: "Windows Server 2022"
      type: domain_controller
      services: ["kerberos", "ldap", "dns"]
      roles: ["domain_controller", "dns_server"]

    - hostname: FILE-BO-01
      ip: "10.44.20.20"
      os: "Windows Server 2019"
      type: server
      services: ["smb", "dfs", "dns-client"]
      roles: ["file_server"]

    - hostname: PROXY-BO-01
      ip: "10.44.20.30"
      os: "Ubuntu 22.04 LTS"
      type: server
      services: ["squid", "dns-client"]
      roles: ["forward_proxy"]

    - hostname: WEB-BO-01
      ip: "10.44.30.10"
      os: "Ubuntu 22.04 LTS"
      type: server
      services: ["nginx", "php-fpm", "ssh", "dns-client"]
      roles: ["web_server"]
      public_hostnames: ["portal.northstarclaims.net"]

  network:
    public_cidrs:
      - "45.83.220.0/28"

    segments:
      - name: workstations
        cidr: "10.44.10.0/24"
        description: "Branch office workstation VLAN"
        exposure: internal
        systems: [WS-MPATEL-01, WS-OREED-01, WS-LMORRIS-01, WS-NKAPOOR-01, WS-VHALE-01]

      - name: servers
        cidr: "10.44.20.0/24"
        description: "Internal server VLAN"
        exposure: internal
        systems: [DC-BO-01, FILE-BO-01, PROXY-BO-01]

      - name: dmz
        cidr: "10.44.30.0/24"
        description: "Small DMZ for the public claims portal"
        exposure: both
        external_ratio: 0.7
        systems: [WEB-BO-01]

    sensors:
      - type: network
        name: bo-core-span
        hostname: ZEEK-BO-CORE
        monitoring_segments: [workstations, servers, dmz]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
        description: "Core switch SPAN for branch east-west and proxy traffic"

      - type: ids
        name: bo-perimeter-ids
        hostname: IDS-BO-EDGE
        monitoring_segments: [dmz]
        direction: inbound
        placement: tap
        log_formats: [snort_alert]
        description: "Perimeter IDS monitoring inbound DMZ traffic"

      - type: firewall
        name: bo-edge-fw
        hostname: FW-BO-EDGE
        monitoring_segments: [workstations, servers, dmz]
        direction: bidirectional
        placement: tap
        log_formats: [cisco_asa]
        interfaces:
          workstations: inside
          servers: inside
          dmz: dmz
        default_action: deny
        deny_ratio: 2.0
        threat_detection_rate: 10
        nat_rules:
          - type: dynamic_pat
            src: [workstations, servers]
            mapped_ip: "45.83.220.1"
          - type: static
            src: dmz
            real_ip: "10.44.30.10"
            mapped_ip: "45.83.220.5"
        policy:
          - {src: external, dst: dmz, ports: [80, 443], action: permit}
          - {src: workstations, dst: servers, ports: [53, 88, 389, 445, 8080], action: permit}
          - {src: workstations, dst: external, ports: [80, 443, 53], action: permit}
          - {src: servers, dst: external, ports: [80, 443, 53, 123], action: permit}
          - {src: dmz, dst: servers, ports: [53, 88, 389, 445, 3389], action: permit}
          - {src: servers, dst: servers, ports: [53, 88, 389, 445], action: permit}

time_window:
  start: "2024-05-14T12:00:00Z"
  duration: "6h"
  warmup: "2h"

baseline_activity:
  description: "Normal branch office workday traffic with web browsing through the proxy, file share access, domain authentication, public web visitors, and modest suspicious background noise."
  intensity: medium
  variation: medium
  suspicious_noise: medium
  traffic_rates:
    web: low
    user_activity: low
    persona_connections: low

observation_profile: complete
logon_grace_period: "45m"

storyline:
  - id: evt-001
    time: "+20m"
    actor: www-data
    system: WEB-BO-01
    activity: "External vulnerability scanner probes the public claims portal"
    events:
      - type: web_scan
        technique: "T1595.002 - Active Scanning: Vulnerability Scanning"
        description: "Scanner probes common web paths and triggers web, Zeek HTTP, firewall, and IDS evidence"
        source_ip: "185.199.110.42"
        dst_ip: "45.83.220.5"
        dst_port: 80
        hostname: "portal.northstarclaims.net"
        preset: nikto
        rate: 4.0
        duration: "3m"

  - id: evt-002
    time: "+32m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker follows up with a directory/file wordlist scan against the portal"
    events:
      - type: web_scan
        technique: "T1595.003 - Active Scanning: Wordlist Scanning"
        description: "Wordlist-based content discovery scan looking for admin panels and backup files"
        source_ip: "185.199.110.42"
        dst_ip: "45.83.220.5"
        dst_port: 80
        hostname: "portal.northstarclaims.net"
        preset: gobuster
        rate: 6.0
        duration: "4m"

  - id: evt-003
    time: "+48m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker obtains a shell on the web server via an exposed portal component"
    events:
      - type: ssh_session
        technique: "T1078.003 - Valid Accounts: Local Accounts"
        description: "Interactive access lands on the public web server as the web service account"
        source_ip: "185.199.110.42"

  - id: evt-004
    time: "+52m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker checks process identity on the compromised web server"
    events:
      - type: process
        technique: "T1033 - System Owner/User Discovery"
        process_name: "/usr/bin/id"
        command_line: "id"

  - id: evt-005
    time: "+58m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker fingerprints the host operating system and kernel version"
    events:
      - type: process
        technique: "T1082 - System Information Discovery"
        process_name: "/usr/bin/uname"
        command_line: "uname -a"

  - id: evt-006
    time: "+1h4m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker performs light internal network discovery from the DMZ host"
    events:
      - type: process
        technique: "T1016 - System Network Configuration Discovery"
        process_name: "/usr/sbin/ip"
        command_line: "ip addr"
      - type: process
        technique: "T1049 - System Network Connections Discovery"
        process_name: "/usr/sbin/ss"
        command_line: "ss -tulpn"

  - id: evt-007
    time: "+1h10m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker scans the internal server VLAN from the compromised DMZ host"
    events:
      - type: port_scan
        technique: "T1046 - Network Service Discovery"
        description: "Low-volume scan from the web server toward the internal server VLAN"
        source_ip: "10.44.30.10"
        target_segment: servers
        target_count: 8
        ports: [22, 80, 445, 3389]
        scan_rate: 8.0

  - id: evt-008
    time: "+1h20m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker searches local web application files for hard-coded credentials"
    events:
      - type: process
        technique: "T1552.001 - Unsecured Credentials: Credentials In Files"
        process_name: "/usr/bin/grep"
        command_line: "grep -ri password /var/www/portal/config/*"

  - id: evt-009
    time: "+1h34m"
    actor: nina.kapoor
    system: FILE-BO-01
    activity: "Attacker uses the harvested admin credentials to RDP from the DMZ web server to the file server"
    events:
      - type: rdp_session
        technique: "T1021.001 - Remote Services: Remote Desktop Protocol"
        description: "Administrative RDP session creates Windows logon and network flow evidence"
        source_ip: "10.44.30.10"

  - id: evt-010
    time: "+1h48m"
    actor: nina.kapoor
    system: FILE-BO-01
    activity: "Attacker enumerates claims file shares on the file server"
    events:
      - type: process
        technique: "T1083 - File and Directory Discovery"
        process_name: "C:\\Windows\\System32\\cmd.exe"
        command_line: "cmd.exe /c dir \\\\FILE-BO-01\\Claims /s"

  - id: evt-011
    time: "+1h56m"
    actor: nina.kapoor
    system: FILE-BO-01
    activity: "Attacker stages a small archive of Q2 claims data for later collection"
    events:
      - type: process
        technique: "T1560.001 - Archive Collected Data: Archive via Utility"
        process_name: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        command_line: "powershell.exe -NoProfile -Command Compress-Archive -Path \\\\FILE-BO-01\\Claims\\Q2 -DestinationPath C:\\Windows\\Temp\\q2-rollup.zip -Force"

  - id: evt-012
    time: "+2h6m"
    actor: nina.kapoor
    system: FILE-BO-01
    activity: "Attacker installs a scheduled task on the file server for persistence"
    events:
      - type: process
        technique: "T1053.005 - Scheduled Task/Job: Scheduled Task"
        process_name: "C:\\Windows\\System32\\schtasks.exe"
        command_line: "schtasks /create /tn \"WindowsUpdateCheck\" /tr C:\\Windows\\Temp\\svc-helper.exe /sc onlogon /ru SYSTEM"

  - id: evt-013
    time: "+2h20m"
    actor: nina.kapoor
    system: DC-BO-01
    activity: "Attacker pivots from the file server to the domain controller using the same admin account"
    events:
      - type: rdp_session
        technique: "T1021.001 - Remote Services: Remote Desktop Protocol"
        description: "Administrative RDP session to the domain controller creates Windows logon and network flow evidence"
        source_ip: "10.44.20.20"

  - id: evt-014
    time: "+2h38m"
    actor: nina.kapoor
    system: DC-BO-01
    activity: "Attacker enumerates Domain Admins group membership from the domain controller"
    events:
      - type: process
        technique: "T1069.002 - Permission Groups Discovery: Domain Groups"
        process_name: "C:\\Windows\\System32\\net.exe"
        command_line: "net group \"Domain Admins\" /domain"

  - id: evt-015
    time: "+2h50m"
    actor: nina.kapoor
    system: DC-BO-01
    activity: "Attacker enumerates domain accounts via PowerShell Active Directory module"
    events:
      - type: process
        technique: "T1087.002 - Account Discovery: Domain Account"
        process_name: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        command_line: "powershell.exe -NoProfile -Command Get-ADUser -Filter * -Properties LastLogonDate"

  - id: evt-016
    time: "+3h2m"
    actor: nina.kapoor
    system: WS-NKAPOOR-01
    activity: "Attacker scans peer workstations from the compromised admin workstation"
    events:
      - type: port_scan
        technique: "T1046 - Network Service Discovery"
        description: "Scan from the admin workstation toward the rest of the workstation VLAN"
        source_ip: "10.44.10.24"
        target_segment: workstations
        target_count: 5
        ports: [445, 3389]
        scan_rate: 5.0

  - id: evt-017
    time: "+3h20m"
    actor: nina.kapoor
    system: WS-NKAPOOR-01
    activity: "Compromised admin workstation begins regular HTTPS beaconing through the explicit proxy to attacker infrastructure"
    events:
      - type: beacon
        technique: "T1071.001 - Application Layer Protocol: Web Protocols"
        description: "Regular HTTPS beaconing through the branch proxy creates proxy, Zeek, firewall, and EDR flow evidence"
        dst_ip: "45.83.221.30"
        dst_port: 443
        hostname: "northlakeportal.com"
        service: ssl
        interval: "5m"
        duration: "35m"
        action: allow

  - id: evt-018
    time: "+4h5m"
    actor: nina.kapoor
    system: WS-NKAPOOR-01
    activity: "Attacker clears Windows security event logs to cover tracks"
    events:
      - type: process
        technique: "T1070.001 - Indicator Removal: Clear Windows Event Logs"
        process_name: "C:\\Windows\\System32\\wevtutil.exe"
        command_line: "wevtutil cl Security"

  - id: evt-019
    time: "+4h30m"
    actor: nina.kapoor
    system: WS-NKAPOOR-01
    activity: "Attacker exfiltrates the staged claims archive over the existing beacon channel"
    events:
      - type: beacon
        technique: "T1041 - Exfiltration Over C2 Channel"
        description: "A larger, longer-held HTTPS session through the proxy carries the staged archive out to attacker infrastructure"
        dst_ip: "45.83.221.30"
        dst_port: 443
        hostname: "northlakeportal.com"
        service: ssl
        interval: "1m"
        duration: "20m"
        action: allow

  - id: evt-020
    time: "+4h55m"
    actor: www-data
    system: WEB-BO-01
    activity: "Attacker closes out the SSH session on the DMZ web server, ending the intrusion"
    events:
      - type: ssh_session
        technique: "T1078.003 - Valid Accounts: Local Accounts"
        description: "Final short interactive session on the web server before the attacker disconnects"
        source_ip: "185.199.110.42"

red_herrings:
  - id: rh-001
    time: "+5h20m"
    actor: victor.hale
    system: WS-VHALE-01
    activity: "Branch manager mistypes a password during a VPN reconnect"
    explanation: "Benign user error that creates a small cluster of failed authentication evidence"
    events:
      - type: failed_logon
        source_ip: "198.51.100.77"
        logon_type: 3

  - id: rh-002
    time: "+5h45m"
    actor: lena.morris
    system: WS-LMORRIS-01
    activity: "Claims analyst runs a large but legitimate quarterly export against the file server"
    explanation: "Heavier-than-usual but authorized file access that can look like staging in isolation"
    events:
      - type: process
        process_name: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        command_line: "powershell.exe -NoProfile -Command Copy-Item -Path \\\\FILE-BO-01\\Claims\\Q2 -Destination C:\\Users\\lena.morris\\Documents\\Q2-export -Recurse"

output:
  logs:
    - format: windows
    - format: zeek
    - format: ecar
    - format: syslog
    - format: bash_history
    - format: snort_alert
    - format: cisco_asa
    - format: web_access
    - format: proxy_access
  destination: scenarios/branch-office-extended-example
  compression: false
